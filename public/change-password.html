
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Change Password | Cloud Local</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0f15;
      --panel: #161b25;
      --border: #2a3241;
      --text: #edf1fa;
      --muted: #929db1;
      --accent: #91a4ff;
      --green: #69ddb0;
      --red: #ff8585;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 14px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 "Segoe UI", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 410px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: 13px;
      background: #252e4c;
      color: var(--accent);
      font-size: 27px;
    }

    h1 { margin: 0; font-size: 23px; }
    h2 { margin: 0 0 5px; font-size: 19px; }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      padding: 25px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .description {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid #394355;
      border-radius: 9px;
      outline: none;
      background: #0d121a;
      color: var(--text);
      font: inherit;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px #91a4ff22;
    }

    input::placeholder { color: #6f7b90; }

    .password-wrap { position: relative; }

    .password-wrap input { padding-right: 76px; }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: auto;
      min-height: 30px;
      padding: 0 7px;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
    }

    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .requirements {
      margin: -4px 0 16px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .requirements p { margin: 0 0 5px; }
    .requirements ul { margin: 0; padding-left: 18px; }
    .requirements li { margin: 3px 0; }
    .requirements li.valid { color: var(--green); }

    .submit, .secondary {
      width: 100%;
      min-height: 45px;
      padding: 0 15px;
      border-radius: 9px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .submit {
      margin-top: 3px;
      border: 0;
      background: var(--accent);
      color: #11182d;
    }

    .submit:hover { filter: brightness(1.06); }
    .submit:disabled { opacity: .55; cursor: wait; }

    .secondary {
      margin-top: 12px;
      border: 1px solid var(--border);
      background: #293243;
      color: var(--text);
      font-weight: 500;
    }

    #message {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    #message.error {
      display: block;
      border-color: #63333b;
      background: #38232b;
      color: var(--red);
    }

    #message.success {
      display: block;
      border-color: #285541;
      background: #182b25;
      color: var(--green);
    }

    footer {
      margin-top: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 420px) {
      .panel { padding: 20px 17px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="brand">
      <div class="logo">↓</div>
      <div>
        <h1>Cloud Local</h1>
        <div class="subtitle">Your personal download manager</div>
      </div>
    </header>

    <section class="panel">
      <h2>Change Password</h2>
      <p class="description">
        Verify your current password and choose a new one.
      </p>

      <form id="passwordForm">
        <div class="field">
          <label for="oldPassword">Current password</label>
          <div class="password-wrap">
            <input
              id="oldPassword"
              name="oldPassword"
              type="password"
              placeholder="Enter your current password"
              autocomplete="current-password"
              required
            >
            <button
              class="toggle-password"
              type="button"
              data-target="oldPassword"
              aria-label="Show current password"
            >Show</button>
          </div>
        </div>

        <div class="field">
          <label for="newPassword">New password</label>
          <div class="password-wrap">
            <input
              id="newPassword"
              name="newPassword"
              type="password"
              placeholder="Create a new password"
              autocomplete="new-password"
              required
            >
            <button
              class="toggle-password"
              type="button"
              data-target="newPassword"
              aria-label="Show new password"
            >Show</button>
          </div>
        </div>

        <div class="requirements">
          <p>Password requirements</p>
          <ul>
            <li id="lengthRule">At least 8 characters</li>
            <li id="byteRule">No more than 72 UTF-8 bytes</li>
            <li id="differentRule">Different from current password</li>
          </ul>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <div class="password-wrap">
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              placeholder="Enter your new password again"
              autocomplete="new-password"
              required
            >
            <button
              class="toggle-password"
              type="button"
              data-target="confirmPassword"
              aria-label="Show confirmation password"
            >Show</button>
          </div>
        </div>

        <button class="submit" id="saveBtn" type="submit">
          Change Password
        </button>

        <div id="message" role="status" aria-live="polite"></div>
      </form>

      <button class="secondary" id="backBtn" type="button">
        ← Back to Downloads
      </button>
    </section>

    <footer>
      Local account security · Cloud Local
    </footer>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    const form = $("passwordForm");
    const oldPassword = $("oldPassword");
    const newPassword = $("newPassword");
    const confirmPassword = $("confirmPassword");
    const saveBtn = $("saveBtn");
    const message = $("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function updateRequirements() {
      const value = newPassword.value;
      const bytes = new TextEncoder().encode(value).length;

      $("lengthRule").classList.toggle(
        "valid", value.length >= 8
      );

      $("byteRule").classList.toggle(
        "valid", bytes <= 72
      );

      $("differentRule").classList.toggle(
        "valid",
        value.length > 0 && value !== oldPassword.value
      );
    }

    oldPassword.addEventListener("input", updateRequirements);
    newPassword.addEventListener("input", updateRequirements);

    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {
        const field = $(button.dataset.target);
        const show = field.type === "password";

        field.type = show ? "text" : "password";
        button.textContent = show ? "Hide" : "Show";

        button.setAttribute(
          "aria-label",
          (show ? "Hide " : "Show ") +
          ({
            oldPassword: "current password",
            newPassword: "new password",
            confirmPassword: "confirmation password"
          }[field.id])
        );
      });
    });

    async function api(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        credentials: "same-origin"
      });

      const data = await response.json().catch(() => ({}));

      if (response.status === 401) {
        window.location.replace("/login");
        throw new Error("Please log in again.");
      }

      if (!response.ok) {
        throw new Error(data.error || "Request failed.");
      }

      return data;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.className = "";
      message.textContent = "";

      const oldValue = oldPassword.value;
      const newValue = newPassword.value;
      const confirmValue = confirmPassword.value;
      const bytes = new TextEncoder().encode(newValue).length;

      if (newValue.length < 8 || bytes > 72) {
        showMessage(
          "The new password must be at least 8 characters and no more than 72 UTF-8 bytes.",
          "error"
        );
        return;
      }

      if (newValue === oldValue) {
        showMessage(
          "Your new password must differ from your current password.",
          "error"
        );
        return;
      }

      if (newValue !== confirmValue) {
        showMessage("The new passwords do not match.", "error");
        confirmPassword.focus();
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Updating password...";

      try {
        const result = await api("/api/change-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            oldPassword: oldValue,
            newPassword: newValue
          })
        });

        form.reset();
        updateRequirements();

        document.querySelectorAll(".toggle-password").forEach(button => {
          const field = $(button.dataset.target);
          field.type = "password";
          button.textContent = "Show";
        });

        showMessage(
          result.message || "Password changed successfully.",
          "success"
        );

      } catch (error) {
        showMessage(
          error.message || "Could not connect to the server.",
          "error"
        );
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Change Password";
      }
    });

    $("backBtn").addEventListener("click", () => {
      window.location.href = "/";
    });
  </script>
</body>
</html>
